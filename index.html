<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixa - Kalwar Puliya | Review</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Stars -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <img src="image.png" alt="Fixa Logo" class="logo">
                <p class="subtitle">Clothing store in Jaipur</p>
                <p class="address">WPWJ+FCH, Harnathapura, Jhotwara, Jaipur</p>
            </div>
            
            <div class="rating-section">
                <h2>Rate your experience</h2>
                <div class="stars" id="star-rating">
                    <i class="fa-solid fa-star" data-value="1"></i>
                    <i class="fa-solid fa-star" data-value="2"></i>
                    <i class="fa-solid fa-star" data-value="3"></i>
                    <i class="fa-solid fa-star" data-value="4"></i>
                    <i class="fa-solid fa-star" data-value="5"></i>
                </div>
                <p id="rating-text">Select a rating</p>
            </div>

            <div class="message-section">
                <h2>Select a message</h2>
                <div class="chips-container" id="chips-container">
                    <button class="chip">Absolutely love the collection! Great quality & fits perfectly. 👗✨</button>
                    <button class="chip">Best clothing store in Kalwar Puliya. Highly recommend! 🛍️👍</button>
                    <button class="chip">Super friendly staff, helped me find exactly what I needed. 🤝😊</button>
                    <button class="chip">Affordable prices with premium quality. Will visit again. 💯🔥</button>
                </div>
            </div>

            <div class="action-section">
                <button id="submit-btn" class="primary-btn" disabled>
                    <span>Copy & Post to Google</span>
                    <i class="fa-brands fa-google"></i>
                </button>
                <p class="helper-text">Your message will be copied. Paste it on the Google review page!</p>
            </div>
        </div>
    </div>

    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
